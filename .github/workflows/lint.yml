name: Lint README

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-readme:
    name: Validate README Format & Sorting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run README Validator
        run: python scripts/validate_readme.py
